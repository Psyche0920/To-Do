services:
  # Other containers on this Compose network can connect using db:5432.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # HOST_PORT:CONTAINER_PORT forwards the Mac port to the PostgreSQL port.
    ports:
      - "127.0.0.1:5432:5432"
    # Mount real Docker-managed storage at the container database directory.
    volumes:
      - pgdata:/var/lib/postgresql/data


# Declare the named volume; this YAML section is not a physical directory.
volumes:
  pgdata:
